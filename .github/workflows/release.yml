name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: formatting
        run: make fmt-check

      - name: vet
        run: make vet

      - name: unit tests
        run: make test

      - name: end-to-end tests
        run: make e2e

  release:
    name: build and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: package every platform
        run: make dist VERSION=${{ github.ref_name }}

      - name: verify the artifacts
        run: |
          set -eu
          cd dist
          sha256sum -c checksums.txt
          tar -xzf "osql_${{ github.ref_name }}_linux_amd64.tar.gz"
          reported="$(./osql_${{ github.ref_name }}_linux_amd64/osql --version)"
          echo "$reported"
          case "$reported" in
            *"${{ github.ref_name }}"*) ;;
            *) echo "the binary does not report ${{ github.ref_name }}"; exit 1 ;;
          esac
          rm -rf "osql_${{ github.ref_name }}_linux_amd64"

      - name: write the release notes
        run: |
          cat > notes.md <<'NOTES'
          osql is an early release. It works, and it is honest about what it
          cannot do yet — expect rough edges, and expect breaking changes
          between 0.x versions.

          ## Install

          ```bash
          curl -fsSL https://raw.githubusercontent.com/farhapartex/osql/main/install.sh | sh
          ```

          Or with Go:

          ```bash
          go install github.com/farhapartex/osql@VERSION
          ```

          Or download a tarball below, unpack it, and move `osql` onto your PATH.
          Every archive carries its own `LICENSE` and `README.md`, and
          `checksums.txt` lets you verify what you downloaded:

          ```bash
          sha256sum -c checksums.txt
          ```

          ## What works

          Listing and filtering files and folders, counting, folder summaries,
          installed apps, reading text files, creating files and folders,
          deleting to the trash with a preview and a typed confirmation, moving
          around with `cd`, and arrow-key line editing with history.

          macOS and Linux. No dependencies — Go's standard library, start to
          finish.

          See the [documentation](https://github.com/farhapartex/osql/blob/main/docs/README.md)
          to get started, and [known gaps](https://github.com/farhapartex/osql/blob/main/docs/errors.md#known-gap)
          for what is still missing.
          NOTES
          sed -i "s|@VERSION|@${{ github.ref_name }}|" notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "osql ${{ github.ref_name }}" \
            --notes-file notes.md \
            --verify-tag \
            dist/*.tar.gz \
            dist/checksums.txt
