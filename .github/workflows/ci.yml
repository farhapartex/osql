name: CI

on:
  push:
    branches: [main, stage]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go version
        run: go version

      - name: version file is well formed
        run: make version-check

      - name: formatting
        run: make fmt-check

      - name: vet
        run: make vet

      - name: build
        run: go build ./...

      - name: unit tests
        run: make test

      - name: end-to-end tests
        run: make e2e

  cross:
    name: cross-compile every target
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build all platforms
        run: make cross

      - name: package a throwaway release
        run: make dist VERSION=ci-${{ github.sha }}

      - name: check the artifacts are usable
        run: |
          set -eu
          cd dist
          sha256sum -c checksums.txt
          tar -xzf osql_ci-${{ github.sha }}_linux_amd64.tar.gz
          ./osql_ci-${{ github.sha }}_linux_amd64/osql --version
