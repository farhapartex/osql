name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: formatting
        run: make fmt-check

      - name: vet
        run: make vet

      - name: unit tests
        run: make test

      - name: end-to-end tests
        run: make e2e

  release:
    name: build and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: the tag must match the VERSION file
        run: |
          set -eu
          make version-check
          file_version="v$(cat VERSION)"
          tag="${{ github.ref_name }}"
          if [ "$file_version" != "$tag" ]; then
            echo "The tag and the VERSION file disagree."
            echo "  tag:          $tag"
            echo "  VERSION file: $file_version"
            echo "Bump VERSION to match the tag (or retag) and try again."
            exit 1
          fi
          echo "tag $tag matches VERSION"

      - name: package every platform
        run: make dist VERSION=${{ github.ref_name }}

      - name: verify the artifacts
        run: |
          set -eu
          cd dist
          sha256sum -c checksums.txt
          tar -xzf "osql_${{ github.ref_name }}_linux_amd64.tar.gz"
          reported="$(./osql_${{ github.ref_name }}_linux_amd64/osql --version)"
          echo "$reported"
          case "$reported" in
            *"${{ github.ref_name }}"*) ;;
            *) echo "the binary does not report ${{ github.ref_name }}"; exit 1 ;;
          esac
          rm -rf "osql_${{ github.ref_name }}_linux_amd64"

      - name: write the release notes
        run: |
          set -eu
          sed "s|__VERSION__|${{ github.ref_name }}|g" \
            .github/release-notes.md > notes.md
          echo "--- notes.md ---"
          cat notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "osql ${{ github.ref_name }}" \
            --notes-file notes.md \
            --verify-tag \
            dist/*.tar.gz \
            dist/checksums.txt
